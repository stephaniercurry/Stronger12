/* Softer, expressive palette inspired by modern mindfulness interfaces.
   Restrained decoration keeps dense logs legible and touch-friendly. */
:root{
 --ink:#26344b;
 --muted:#626d7d;
 --line:#e3e5ee;
 --paper:#f7f7fb;
 --white:#fff;
 --forest:#303763;
 --green:#187e82;
 --mint:#e5f4f2;
 --peach:#ffe4e5;
 --peach-ink:#894058;
 --gold:#eebd80;
 --blue:#dff0f9;
 --shadow:0 9px 30px rgba(42,48,92,.055);
}
body{background:var(--paper);color:var(--ink)}
h1{font-size:clamp(29px,4vw,39px);letter-spacing:-1.45px;line-height:1.12}
h2{letter-spacing:-.55px}
p,.lead{color:var(--muted)}
input,select,textarea{border-color:#d5dce7;border-radius:13px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline-color:#71bdbe}
.sidebar{background:var(--forest)}
.brandmark{background:#f7b5c4;color:#303763;border-radius:17px}
.brandsub{color:#bcc4e2}

.progress{background:#e8eef2}

.chartbar{background:#a5d9d7}

}

 .masthead.home-head{background:#fff;min-height:0;padding:8px 0;border:0}

/* Life: compact meal inspiration with optional one-tap grocery planning. */
.dinner-emblem{display:grid;place-items:center;width:49px;height:49px;flex:0 0 49px;border-radius:16px;background:#ffe6e8;font-size:24px}
.dinner-add{border:1px solid #e7e6ef;border-radius:15px;background:#fafafb;margin-top:16px;padding:12px 15px}
.dinner-add>summary{font-size:14px;font-weight:800;color:var(--forest);cursor:pointer;min-height:24px}
.dinner-add[open]{background:#fff}
.dinner-add form input,.dinner-add form textarea{font-size:16px}
.dinner-notice{margin-top:14px}
.dinner-ideas-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:17px}
.dinner-idea{border:1px solid #e6e5ed;border-radius:17px;background:#fffafb;padding:15px;min-width:0;display:flex;flex-direction:column;gap:10px}
.dinner-idea-top{display:flex;justify-content:space-between;align-items:start;gap:9px}
.dinner-idea-top strong{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.dinner-plate{color:#d991a9;font-size:24px;line-height:1}
.dinner-notes{font-size:12px;line-height:1.55;margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dinner-ingredients{border:1px solid #e7e6ee;background:#fff;border-radius:11px;padding:9px 11px}
.dinner-ingredients>summary{font-weight:700;color:#347b7f}
.dinner-ingredients ul{margin:8px 0 0;padding-left:21px;line-height:1.7;color:var(--muted)}
.dinner-ingredients li{overflow-wrap:anywhere}
.dinner-actions{gap:7px;margin-top:auto}
.dinner-actions .btn.small{font-size:11px;min-height:36px;padding:7px 9px}
.dinner-actions a.btn{text-decoration:none}
.dinner-empty{background:#faf9fc;border:1px dashed #e5dfeb;color:var(--muted);margin-top:16px;padding:18px;border-radius:14px;font-size:13px}
@media(max-width:760px){.dinner-ideas-list{grid-template-columns:1fr}.dinner-idea{padding:14px}}



/* Compact recipe rows with familiar swipe-left management. */
.dinner-ideas-list{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;margin-top:17px}
.dinner-list-entry{border:1px solid #e6e5ed;border-radius:16px;background:#fff;overflow:hidden;min-width:0}
.dinner-swipe{position:relative;overflow:hidden;background:#f4eef3;touch-action:pan-y}
.dinner-swipe-actions{position:absolute;inset:0 0 0 auto;display:flex;width:174px;pointer-events:none}
.dinner-swipe.is-revealed .dinner-swipe-actions{pointer-events:auto}
.dinner-edit-reveal,.dinner-delete-reveal{flex:1;min-width:0;border:0;color:white;font-size:14px;font-weight:750}
.dinner-edit-reveal{background:#467e86}.dinner-delete-reveal{background:#b93e43}
.dinner-row{display:flex;align-items:center;gap:10px;min-height:59px;padding:10px 12px;background:#fff;position:relative;z-index:1;transition:transform .18s ease;will-change:transform}
.dinner-swipe.is-revealed .dinner-row{transform:translateX(-174px)}
.dinner-item-name{font-size:15px;line-height:1.35;font-weight:800;overflow-wrap:anywhere;flex:1;min-width:0;text-align:left}
button.dinner-item-name{border:0;background:transparent;padding:8px 0;display:flex;align-items:center;gap:9px;color:var(--ink)}
.dinner-expand-icon{color:#8e9ba9;flex:0 0 auto;font-size:19px;font-weight:800}
.dinner-recipe-link{display:inline-flex;flex:0 0 auto;align-items:center;min-height:38px;padding:7px 10px;border:1px solid #c6e2e2;border-radius:11px;color:#21757a;font-size:12px;font-weight:800;text-decoration:none;background:#f0fafa}
.dinner-recipe-link:hover{background:#e5f4f4}
.dinner-more{border:0;background:transparent;color:#7b8298;min-height:42px;min-width:38px;flex:0 0 38px;border-radius:8px;font-size:20px;line-height:1}
.dinner-more:focus-visible,.dinner-edit-reveal:focus-visible,.dinner-delete-reveal:focus-visible{outline:3px solid #8fc7ca;outline-offset:-3px}
.dinner-detail{background:#fffafc;border-top:1px solid #f0e6ec;padding:12px 14px 14px}
.dinner-detail .dinner-notes{margin:0 0 9px}
.dinner-detail-label{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.03em}
.dinner-ingredient-list{margin:8px 0 12px;padding-left:21px;color:var(--muted);font-size:13px;line-height:1.7}
.dinner-ingredient-list li{overflow-wrap:anywhere}
@media(max-width:760px){.dinner-row{gap:7px;padding:9px 10px}.dinner-recipe-link{padding:6px 9px}.dinner-more{min-width:34px;flex-basis:34px}}
@media(prefers-reduced-motion:reduce){.dinner-row{transition:none}}



/* Analog-style recipe dividers: compact, accessible, no layout changes elsewhere. */
.recipe-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:17px 0 1px;padding-bottom:0;border-bottom:2px solid #e5e8ef}
.recipe-tab{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;min-height:46px;border:1px solid #e2dfe9;border-bottom:0;border-radius:13px 13px 0 0;background:#f6f4f8;color:#606982;padding:10px 8px;font-size:13px;font-weight:800}
.recipe-tab:hover{background:#f4eaef}
.recipe-tab.active{color:#303763;background:#ffedf0;border-color:#e9b7ca;box-shadow:inset 0 3px 0 #ef9ab3}
.recipe-tab-count{display:inline-flex;min-width:20px;height:20px;border-radius:20px;align-items:center;justify-content:center;padding:1px 5px;font-size:10px;background:#e7e8ee;color:#59637d}
.recipe-tab.active .recipe-tab-count{background:#f4c7d3;color:#733b56}
.recipe-tab:focus-visible{outline:3px solid #7eb9bf;outline-offset:2px}
@media(max-width:370px){.recipe-tab{font-size:12px;padding:10px 3px;gap:4px}.recipe-tab-count{min-width:18px;height:18px}}



.recipe-subfilters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:13px 0 3px}
.recipe-subfilter{border:1px solid #dde5eb;border-radius:999px;background:#f8fafb;color:#59687c;font-size:12px;font-weight:700;min-height:36px;padding:7px 10px;display:inline-flex;align-items:center;gap:5px}
.recipe-subfilter:hover{background:#edf7f5}
.recipe-subfilter.active{background:#e1f2f1;color:#226d70;border-color:#92c7c8}
.recipe-subfilter-count{font-size:10px;display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#e8ebee;color:#5b6c78}
.recipe-subfilter.active .recipe-subfilter-count{background:#b9e3e1;color:#25585a}
.recipe-subfilter:focus-visible{outline:3px solid #7eb9bf;outline-offset:2px}



/* Tappable saved important dates—no redundant management dropdown. */
.important-date-list{display:grid;gap:9px;margin-top:17px}
.important-date-entry{overflow:hidden;border:1px solid #deebee;border-radius:16px;background:#f6fafb}
.important-date-entry.selected{border-color:#9ecbcc;background:#f9fcfc}
.important-date-trigger{width:100%;display:flex;gap:12px;align-items:center;min-height:65px;padding:12px 14px;border:0;background:transparent;text-align:left;color:var(--ink)}

.important-date-emoji{font-size:23px;flex:0 0 29px;text-align:center}
.important-date-copy{display:grid;gap:3px;flex:1;min-width:0}
.important-date-copy strong{font-size:15px;overflow-wrap:anywhere}
.important-date-copy .tiny{font-size:12px;line-height:1.45}
.important-date-chevron{flex:0 0 auto;color:#7d9da1;font-size:20px;font-weight:750}
.important-date-actions{display:flex;gap:9px;padding:0 14px 13px 55px}
.important-date-actions .btn{min-height:41px;min-width:78px}
@media(max-width:760px){.important-date-trigger{padding:12px}.important-date-actions{padding:0 12px 13px 51px}}



/* Small, optional digital envelope wallet. Collapsed by default on Life. */
.money-panel-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;background:transparent;border:0;text-align:left;padding:0;color:var(--ink);min-height:62px}
.money-panel-toggle>span:first-child{display:grid;gap:5px}
.money-panel-title{font-size:21px;font-weight:850;letter-spacing:-.4px}
.money-panel-arrow{font-size:25px;color:var(--green);font-weight:800}
.money-body{border-top:1px solid var(--line);padding-top:17px;margin-top:14px}
.money-message{margin-bottom:12px}
.money-total{display:flex;justify-content:space-between;align-items:center;background:#eaf5f5;border-radius:14px;padding:13px 15px;gap:12px;margin-bottom:12px;color:#245f68;font-weight:700}

.money-envelope{background:#fffafc;border:1px solid #f0dee8;border-radius:16px;overflow:hidden;min-width:0}

.money-envelope-face{display:grid;gap:4px;min-height:146px;width:100%;padding:14px;text-align:left;border:0;background:transparent;color:var(--ink);justify-items:start}

.money-envelope-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.money-envelope-amount{font-size:24px;letter-spacing:-.8px;line-height:1.2}
.money-envelope-caption{font-size:11px;color:var(--muted)}

.money-envelope-controls{padding:12px;border-top:1px solid #eee4ec;background:#fff}

.money-placeholder{font-size:12px;padding:11px;border:1px dashed #e0e5ed;border-radius:13px;background:#fafafd;margin:7px 0 0}

/* Today: spending money stays glanceable; detailed accounting stays in Life. */
.money-today-card{display:flex;flex-direction:column;align-items:stretch}
.money-today-total{font-size:23px;font-weight:850;letter-spacing:-.7px;color:#29757a;white-space:nowrap}

.money-today-envelope{border:1px solid #e9e3ee;border-radius:13px;background:#fff8fb;min-width:0;min-height:66px;display:flex;align-items:flex-start;flex-direction:column;justify-content:center;gap:4px;padding:10px 12px;text-align:left;color:var(--ink)}

function repeatEveryDays(t){const n=Number(t.repeatDays);return Number.isInteger(n)&&n>=1&&n<=365?n:1}
function taskRepeatLabel(t){return t.repeat==='interval'?'Every '+repeatEveryDays(t)+' '+(repeatEveryDays(t)===1?'day':'days'):TASK_REPEATS[t.repeat]||t.repeat||'One time'};
function taskDone(t,date=TODAY){
 if((t.repeat||'none')==='none')return !!t.done;
 return Array.isArray(t.completedDates)&&t.completedDates.includes(date);
}
function taskOccurs(t,date=TODAY){
 const due=t.due||date,repeat=t.repeat||'none';
 if(repeat==='none')return due<=date&&(!t.done||(t.doneAt||'').slice(0,10)===date);
 if(due>date)return false;
 if(repeat==='daily')return true;
 if(repeat==='weekdays'){const day=dateOf(date).getDay();return day>=1&&day<=5}
 if(repeat==='weekly')return daysBetween(due,date)%7===0;
 if(repeat==='interval')return daysBetween(due,date)%repeatEveryDays(t)===0;

}
function taskSort(a,b){

 if((a.priority||'normal')!==(b.priority||'normal'))return a.priority==='high'?-1:b.priority==='high'?1:0;

function nextTaskDate(t){

const HOLIDAY_GUIDES={

function wheelDates(){
 const seasonal=[
 ['Imbolc','02-01','🕯️','Returning light, renewal and early hints of spring. Often observed Feb 1–2.',false],
 ['Ostara','03-20','🌱','Spring equinox; balance, new growth and beginnings.',true],
 ['Beltane','05-01','🔥','Flowers, creativity, vitality and the brighter half of the year.',false],
 ['Litha','06-21','☀️','Summer solstice and the longest daylight of the year.',true],
 ['Lughnasadh','08-01','🌾','First harvest; bread, gratitude and community.',false],
 ['Mabon','09-22','🍂','Autumn equinox, harvest and transition.',true],
 ['Samhain','10-31','🕯️','Ancestors, remembrance and the darker half of the year. Often Oct 31–Nov 1.',false],
 ['Yule','12-21','❄️','Winter solstice, the longest night and returning light.',true]
 ];
 // Solar times in UTC, displayed in the phone's local time zone.
 const solar={
  2026:{Ostara:'2026-03-20T14:45:00Z',Litha:'2026-06-21T08:25:00Z',Mabon:'2026-09-23T00:05:00Z',Yule:'2026-12-21T20:50:00Z'},
  2027:{Ostara:'2027-03-20T20:24:00Z',Litha:'2027-06-21T14:10:00Z',Mabon:'2027-09-23T06:01:00Z',Yule:'2027-12-22T02:42:00Z'},
  2028:{Ostara:'2028-03-20T02:17:00Z',Litha:'2028-06-20T20:01:00Z',Mabon:'2028-09-22T11:45:00Z',Yule:'2028-12-21T08:20:00Z'}
 };
 const yearNow=Number(TODAY.slice(0,4)),all=[];
 for(let year=yearNow;year<=yearNow+2;year++){
  for(const [name,monthDay,emoji,meaning,isSolar] of seasonal){
   const instant=solar[year]&&solar[year][name],date=isSolar&&instant?iso(new Date(instant)):year+'-'+monthDay;
   if(date>=TODAY)all.push({name,date,emoji,meaning,learn:HOLIDAY_GUIDES[name],approx:isSolar&&!instant});
  }
 }
 return all.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12);
}
const BIRTHDAY_RELATIONS=['Family','Friend','Other'];

function validBirthday(month,day,birthYear){
 const m=Number(month),d=Number(day),y=birthYear?Number(birthYear):2024,currentY=Number(TODAY.slice(0,4));
 return Number.isInteger(m)&&m>=1&&m<=12&&Number.isInteger(d)&&d>=1&&d<=31&&
  Number.isInteger(y)&&y>=1800&&y<=currentY&&d<=new Date(y,m,0).getDate();
}
function birthdayDate(b,year){
 // Feb 29 is observed Feb 28 during non-leap years, for display purposes.
 const m=Number(b.month),day=Number(b.day),d=m===2&&day===29&&new Date(year,2,0).getDate()===28?28:day;
 return [year,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
}
function birthdayEvents(from=TODAY,count=380){
 const events=[],startYear=Number(from.slice(0,4))-1,end=addDays(from,count);
 for(const b of state.birthdays){
  for(let y=startYear;y<=Number(end.slice(0,4));y++){
   const date=birthdayDate(b,y);
   if(date>=from&&date<=end){
    events.push({person:b,date,days:daysBetween(TODAY,date),age:b.year?y-Number(b.year):null});
   }
  }
 }
 return events.sort((a,b)=>a.date.localeCompare(b.date)||a.person.name.localeCompare(b.person.name));
}
function weekBirthdayEvents(){

const IMPORTANT_TYPES={

function validCalendarDate(s){

}
function importantOccurrences(from=TODAY,days=370){
 const end=addDays(from,days),result=[];
 for(const occurrence of birthdayEvents(from,days)){
  result.push({
   id:'birthday:'+occurrence.person.id,
   type:'birthday',title:occurrence.person.name+"'s birthday",
   start:occurrence.date,end:occurrence.date,sortDate:occurrence.date,
   time:'',notes:'',age:occurrence.age,original:occurrence.person
  });
 }
 for(const item of state.importantEvents){
  if(!item||!validCalendarDate(item.start))continue;
  const ending=validCalendarDate(item.end)&&item.end>=item.start?item.end:item.start;
  if(ending<from||item.start>end)continue;
  result.push({
   id:'event:'+item.id,type:IMPORTANT_TYPES[item.type]?item.type:'other',
   title:item.title,start:item.start,end:ending,
   sortDate:item.start<from?from:item.start,time:item.time||'',
   notes:item.notes||'',age:null,original:item
  });
 }
 return result.sort((a,b)=>a.sortDate.localeCompare(b.sortDate)||a.time.localeCompare(b.time)||String(a.title).localeCompare(String(b.title)));
}

/* Virtual envelopes. No banking connection; every deposit is manually assigned money.
   Amounts use integer cents so transactions never accumulate decimal rounding errors. */
function moneyAmount(value){
 const s=String(value??'').trim();
 if(!/^\d{1,10}(?:\.\d{1,2})?$/.test(s))return null;
 const [whole,part='']=s.split('.');
 const cents=Number(whole)*100+Number(part.padEnd(2,'0'));
 return Number.isSafeInteger(cents)&&cents>0?cents:null;
}
function moneyBalance(env){return Number.isSafeInteger(env?.amountCents)&&env.amountCents>=0?env.amountCents:0}
function moneyText(cents){return (Number(cents||0)/100).toLocaleString('en-US',{style:'currency',currency:'USD'})}
function moneyGoal(env){
 return Number.isSafeInteger(env?.goalCents)&&env.goalCents>0?env.goalCents:0;
}

hat include food entries.</p></section>

<section class="card span12"><h2>Training notes & safety</h2><p class="fineprint">This is a general strength-training template, not medical clearance or an individualized rehabilitation plan. Each session can be Home or Gym; both use three sets per exercise. The starting plan uses dumbbells, stable furniture, and rings; it assumes those are available and can be modified to fit your equipment. Begin with loads that allow controlled movement. On painful back days, stop or modify the aggravating exercise. New or progressive weakness, numbness around the groin, or changes in bladder/bowel control warrant urgent medical evaluation. Program progression uses rep ranges and effort; it is not a requirement to increase weight every week.</p><p class="tiny">Protein/fiber values in quick add are approximate. RIR means “repetitions in reserve”: how many more clean reps you believe you could have performed.</p></section></div>`}

document.getElementById('importFile').addEventListener('change',async ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||typeof o!=='object'||!o.settings||!o.workouts||!Array.isArray(o.foods))throw Error('Not a valid Stronger / 12 backup.');if(!confirm('Restore this backup? It will replace the data currently stored in this browser. Export your current data first if you need it.'))return;state={version:1,settings:{...defaultSettings,...o.settings},workouts:o.workouts,foods:o.foods,checkins:Array.isArray(o.checkins)?o.checkins:[],tasks:Array.isArray(o.tasks)?o.tasks:[],yogaSessions:Array.isArray(o.yogaSessions)?o.yogaSessions:[],groceries:Array.isArray(o.groceries)?o.groceries:[],dinnerIdeas:Array.isArray(o.dinnerIdeas)?o.dinnerIdeas:[],moneyEnvelopes:Array.isArray(o.moneyEnvelopes)?o.moneyEnvelopes:[],moneyHistory:Array.isArray(o.moneyHistory)?o.moneyHistory:[],birthdays:Array.isArray(o.birthdays)?o.birthdays:[],importantEvents:Array.isArray(o.importantEvents)?o.importantEvents:[],cycles:Array.isArray(o.cycles)?o.cycles:[],activeCycleId:o.activeCycleId||null,workoutChoices:o.workoutChoices&&typeof o.workoutChoices==='object'&&!Array.isArray(o.workoutChoices)?o.workoutChoices:{}};ensureCycleData();ui.week=currentWeek();save();render();alert('Backup restored.')}catch(err){alert('Could not restore backup: '+err.message)}finally{ev.target.value=''}});
function refreshTodayDate(){
 const fresh=iso(new Date());
 if(fresh===TODAY)return;
 const prev=TODAY;TODAY=fresh;
 if(ui.foodDate===prev)ui.foodDate=fresh;
 if(ui.yogaDate===prev)ui.yogaDate=fresh;
 if(ui.tab==='home'||ui.tab==='lift')ui.week=currentWeek();
 render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshTodayDate()});
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('focus',refreshTodayDate);
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
